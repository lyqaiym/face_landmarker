plugins {
    id 'com.android.library'
}

android {
    namespace 'com.google.mediapipe.mediapipe_tasks'
    compileSdk = rootProject.ext.compileSdkVersion
    ndkVersion = rootProject.ext.ndkVersion

    defaultConfig {
        // logging_unittest.cc 使用 <glob.h> globfree
        minSdk rootProject.ext.minSdkVersion
        targetSdk 32
        versionCode 1
        versionName "1.0"
        ndk {
            abiFilters "arm64-v8a"
        }
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_SDK=" + ANDROID_SDK
                // Bazel compiles every C++ translation unit in this graph at c++20,
                // abseil included. Leaving the dependency subprojects on c++17 makes
                // ABSL_OPTION_USE_STD_SOURCE_LOCATION's autodetection resolve
                // absl::SourceLocation to two different types, and absl::Status's
                // out-of-line MakeErrorImpl instantiations then fail to link.
                cppFlags '-std=c++20'
//                abiFilters 'armeabi-v7a', 'arm64-v8a'
                abiFilters 'arm64-v8a'
                // Without this the dependency subprojects contribute ~1600 targets we
                // never load: unit tests, benchmarks and flatbuffers' samples, which
                // try to run a target-arch flatc on the host.
                targets 'mediapipe_tasks_jni'
            }
        }
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
//
//    compileOptions {
//        sourceCompatibility JavaVersion.VERSION_1_8
//        targetCompatibility JavaVersion.VERSION_1_8
//    }
//    kotlinOptions {
//        jvmTarget = '1.8'
//    }
//    buildFeatures {
//        viewBinding true
//    }
    sourceSets {
        main {
            // Java sources come straight from the mediapipesource Bazel checkout
            // (framework + tasks); generated protos land in src/main/generated/proto.
            java.srcDirs += [
                '../mediapipesource/mediapipe/java',
                '../mediapipesource/mediapipe/tasks/java',
                'src/main/generated'
            ]
            // Legacy MediaPipe "Solutions" API + the full-runtime TypeNameRegistry are not
            // part of the Tasks stack the app uses.
            java.exclude 'com/google/mediapipe/solutions/**'
            java.exclude 'com/google/mediapipe/glutil/**'
            java.exclude 'com/google/mediapipe/solutioncore/**'
            java.exclude 'com/google/mediapipe/components/**'
            java.exclude 'com/google/mediapipe/framework/TypeNameRegistryFull.java'
        }
    }
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
    packagingOptions {
        exclude '**/libopencv_java3.so'
        exclude '**/libopencv_java4.so'
    }
}

dependencies {

    // Kotlin lang
    implementation 'androidx.core:core-ktx:1.8.0'

    // App compat and UI things
    implementation 'androidx.appcompat:appcompat:1.5.1'
    implementation 'com.google.android.material:material:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.fragment:fragment-ktx:1.5.4'

    // Navigation library
    def nav_version = "2.5.3"
    implementation "androidx.navigation:navigation-fragment-ktx:$nav_version"
    implementation "androidx.navigation:navigation-ui-ktx:$nav_version"

    // CameraX core library
    def camerax_version = '1.2.0-alpha02'
    implementation "androidx.camera:camera-core:$camerax_version"

    // CameraX Camera2 extensions
    implementation "androidx.camera:camera-camera2:$camerax_version"

    // CameraX Lifecycle library
    implementation "androidx.camera:camera-lifecycle:$camerax_version"

    // CameraX View class
    implementation "androidx.camera:camera-view:$camerax_version"

    // WindowManager
    implementation 'androidx.window:window:1.1.0-alpha03'

    // Unit testing
    testImplementation 'junit:junit:4.13.2'

    // Instrumented testing
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'

    implementation 'com.google.flogger:flogger:latest.release'
    implementation 'com.google.flogger:flogger-system-backend:latest.release'
    implementation 'com.google.auto.value:auto-value-annotations:1.8.1'
    annotationProcessor 'com.google.auto.value:auto-value:1.8.1'
    implementation 'com.google.guava:guava:27.0.1-android'
    implementation 'com.google.protobuf:protobuf-javalite:4.31.1'
